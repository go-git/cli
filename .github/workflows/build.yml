name: build

on:
  pull_request:

  push:
    branches:
      - main

  workflow_dispatch:
    inputs:
      go_git_ref:
        description: 'go-git ref (commit SHA, tag, or branch) to build gogit against. Empty = go.mod default.'
        required: false
        default: ''

permissions:
  contents: none

jobs:

  build:
    strategy:
      fail-fast: false
      matrix:
        go-version: [stable]
        platform: [ubuntu-latest, ubuntu-24.04-arm, macos-latest, windows-latest]

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ matrix.go-version }}

      - run: make build

      - name: Validate
        run: make validate

  conformance:
    strategy:
      fail-fast: false
      matrix:
        platform: [ubuntu-latest, macos-latest, windows-latest]

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
      - name: Run conformance
        shell: bash
        env:
          GO_GIT_REF: ${{ inputs.go_git_ref }}
          CONFORMANCE_VERBOSE: "1"
        run: make conformance
      - name: Upload TAP results
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: conformance-tap-${{ matrix.platform }}
          path: conformance/.cache/results/
          if-no-files-found: ignore
