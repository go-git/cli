name: build

on:
  pull_request:

  push:
    branches:
      - main

  workflow_dispatch:
    inputs:
      go_git_ref:
        description: 'go-git ref (commit SHA, tag, or branch) to build gogit against. Empty = go.mod default.'
        required: false
        default: ''

permissions:
  contents: none

jobs:

  build:
    strategy:
      fail-fast: false
      matrix:
        go-version: [stable]
        platform: [ubuntu-latest, ubuntu-24.04-arm, macos-latest, windows-latest]

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Setup Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: ${{ matrix.go-version }}

      - run: make build

      - name: Validate
        run: make validate

  conformance:
    strategy:
      fail-fast: false
      matrix:
        platform: [ubuntu-latest, macos-latest, windows-latest]

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Setup Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: stable
      - name: Run conformance
        shell: bash
        env:
          GO_GIT_REF: ${{ inputs.go_git_ref }}
          CONFORMANCE_VERBOSE: "1"
        run: make conformance
      - name: Upload TAP results
        if: failure()
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.0
        with:
          name: conformance-tap-${{ matrix.platform }}
          path: conformance/.cache/results/
          if-no-files-found: ignore
